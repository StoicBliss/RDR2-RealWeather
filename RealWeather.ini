[SETTINGS]
; 1 = Enable mod automatically when the game loads, 0 = Disabled until hotkey pressed
ENABLED_ON_STARTUP = 1

; 1 = Write detailed diagnostic messages to RealWeather.log, 0 = Disable logging
DEBUG = 1

; 1 = Display notification when weather changes, 0 = Silent transitions
NOTIFY_WHEN_SET_WEATHER = 1

; Notification presentation style:
; 1 = Sleek Western Subtitle Banner (Authentic Red Dead bottom subtitle with location, local time & temp)
; 2 = Rich 2-Line Banner (Clean header line with condition & temperature on line 2)
; 3 = Compact Single-Line Subtitle
; 0 = Silent / No Notification
NOTIFICATION_STYLE = 1

; Compatibility behavior when the radar / minimap is hidden (e.g. compass mode, off, or cinematic mode):
; 1 = Subtitle Fallback (Recommended): Automatically displays weather alert as an on-screen subtitle banner
; 2 = Minimap Peek: Temporarily unhides the radar for 4.5 seconds so the feed appears, then restores hidden state
; 0 = Silent / Do Nothing: Disables weather notifications when radar is hidden
MINIMAP_HIDDEN_BEHAVIOR = 1

; 1 = Synchronize in-game clock with the real local time of the selected location (1:1 real-time flow)
; 0 = In-game clock runs at normal RDR2 speed
SYNC_REAL_TIME = 1

; 1 = Pause weather overrides and real-time clock sync during story missions, cutscenes, and scripted events
; 0 = Force real weather and clock sync at all times, even during missions
RESPECT_GAME_MISSIONS = 1

; Time format for notifications and clock:
; 12 = 12-Hour format with AM/PM (e.g. 11:05 AM)
; 24 = 24-Hour format (e.g. 23:05)
TIME_FORMAT = 12

; The location to sync weather from.
; You can use authentic RDR2 frontier territories OR any real-world city!
;
; RDR2 Frontier Territories (automatically mapped to their real-world meteorological counterparts):
;   Valentine, New Hanover      (Maps to Valentine, NE)
;   Saint Denis, Lemoyne        (Maps to New Orleans, LA)
;   Rhodes, Lemoyne             (Maps to Savannah, GA)
;   Blackwater, West Elizabeth  (Maps to Blackwater, MO)
;   Strawberry, West Elizabeth  (Maps to Strawberry, CA)
;   Annesburg, New Hanover      (Maps to Scranton, PA)
;   Armadillo, New Austin       (Maps to Tombstone, AZ)
;   Tumbleweed, New Austin      (Maps to El Paso, TX)
;   Colter, Ambarino            (Maps to Jackson, WY / snowy Rockies)
;   Wapiti, Ambarino            (Maps to Wapiti, WY)
;
; Real-World Cities (Format: City, CountryCode or City, State, Country):
;   Examples: Los Angeles, CA | London, UK | Tokyo, JP | Dhaka, BD | Denver, CO | Austin, TX
LOCATION = Valentine, New Hanover

; Optional OpenWeatherMap API key (from https://home.openweathermap.org/api_keys)
; NOTE: If left BLANK, the mod automatically uses Open-Meteo for 100% free zero-key weather!
API_KEY = 

; Weather service provider:
; Auto = Uses OpenWeatherMap if API_KEY is provided; otherwise seamlessly uses Open-Meteo (zero key required)
; OpenMeteo = Always use Open-Meteo (100% free, no API key needed, worldwide geocoding)
; OpenWeatherMap = Always use OpenWeatherMap (requires valid API_KEY)
PROVIDER = Auto

; 1 = Enable temporary weather cache for the game session (Recommended)
;     Fetches weather once when the game session starts and keeps it alive in memory for the single session.
;     Automatically refreshes every CACHE_DURATION_MINUTES (default: 30 real-world minutes).
;     No repetitive 300s internet polling! You can also force-refresh anytime by pressing Right-Control + R.
; 0 = Continuously pull weather from the internet every UPDATE_INTERVAL_SECONDS
SESSION_CACHE = 1

; Duration in real-world minutes that the session weather cache stays alive before automatically refreshing
; (Default: 30 real minutes)
CACHE_DURATION_MINUTES = 30

; Interval in seconds between weather checks from the internet when SESSION_CACHE = 0 (Minimum: 15)
UPDATE_INTERVAL_SECONDS = 300

; Duration in seconds for smooth weather transition (clouds, lighting, rain fade-in)
TRANSITION_DURATION = 15.0

; Temperature display unit in notifications: C (Celsius) or F (Fahrenheit)
TEMPERATURE_UNIT = C

; Play a subtle Red Dead frontend audio cue when hotkey is pressed or weather changes
PLAY_AUDIO_CUE = 1

[PRESENTATION]
; Header title for weather banners
BANNER_HEADER = Weather Update

; Subtitle format. Use {LOCATION} to automatically insert the resolved location name
BANNER_SUBTITLE = {LOCATION}

; Location naming mode:
; Lore = Shows fictional RDR2 frontier lore-friendly name (e.g. Valentine, New Hanover | Saint Denis, Lemoyne)
; Real = Shows the real-world resolved location (e.g. Valentine, US or London, UK)
LOCATION_DISPLAY_MODE = Lore

; Lore-friendly location name when LOCATION_DISPLAY_MODE = Lore:
; Auto (Recommended) = Automatically tracks where the player is currently located on the map in real-time!
;                      (e.g. Valentine, Saint Denis, Rhodes, Strawberry, Blackwater, The Heartlands, etc.)
; Or set a fixed custom lore name (e.g. Valentine, New Hanover | Saint Denis, Lemoyne | Colter, Ambarino)
LORE_LOCATION_NAME = Auto

; Information rows to show on notifications (1 = Show, 0 = Hide)
SHOW_TIME = 1
SHOW_CONDITION = 1
SHOW_TEMPERATURE = 1

[KEYS]
; Mod hotkeys (Virtual Key Hex codes like 0xA3 = VK_RCONTROL, 0x57 = 'W', 0x54 = 'T', 0x4F = 'O' or key names)
; Set HOLD_KEY = None or -1 to trigger keys without holding a modifier
HOLD_KEY = 0xA3

; Toggle mod on/off shortcut: HOLD_KEY + PRESS_KEY (Default: Right-Control + W)
PRESS_KEY = 0x57

; Toggle Real Time clock sync on/off shortcut: HOLD_KEY + TIME_KEY (Default: Right-Control + T)
TIME_KEY = 0x54

; Preview notification banner shortcut: HOLD_KEY + PREVIEW_KEY (Default: Right-Control + O)
; Press this in-game anytime to immediately test and preview your customized alert!
; NOTE: Default is 0x4F ('O' key) to avoid conflicts with pause or map keys.
PREVIEW_KEY = 0x4F

; Force immediate weather and time refresh shortcut: HOLD_KEY + REFRESH_KEY (Default: Right-Control + R)
REFRESH_KEY = 0x52
